name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waste2wings?schema=public
        run: npx prisma validate

      - name: Build backend image
        run: docker build -t waste2wings-be:ci .

  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://api.waste2wings.example/api/v1
        run: npm run build

      - name: Build frontend image
        env:
          VITE_API_URL: https://api.waste2wings.example/api/v1
        run: docker build --build-arg VITE_API_URL="$VITE_API_URL" -t waste2wings-fe:ci .

  validate-ml:
    name: Validate ML Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build ML image
        run: docker build -t waste2wings-ml:ci .

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    needs:
      - validate-backend
      - validate-frontend
      - validate-ml
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR || '/home/developer/waste2wings' }}"

            cd "$APP_DIR"
            test -f .env

            git fetch origin main
            git reset --hard origin/main

            docker compose --env-file .env config --quiet
            docker compose --env-file .env up -d --build --remove-orphans
            docker compose --env-file .env ps
            docker image prune -f
